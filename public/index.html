<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024, initial-scale=1">
<title>CLAUDE MONITOR</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="skins.css">
</head>
<body>
<div id="crt"></div>

<header id="header">
  <h1>CLAUDE<span>·</span>MONITOR</h1>
  <div id="header-right">
    <button id="sound-chip" class="chip" hidden>&#128264; TAP FOR SOUND</button>
    <button id="skin-chip" class="chip">SKIN <b>CLAUDE</b></button>
    <button id="mode-toggle" class="chip" data-on="false">REMOTE <b>OFF</b></button>
    <div id="clock">--:--</div>
  </div>
</header>

<main>
  <div id="left-col">
    <section id="mascot-panel" class="panel">
      <canvas id="mascot" width="288" height="224"></canvas>
      <div id="mascot-status">zZz</div>
    </section>
    <section id="sessions-panel" class="panel">
      <h2>SESSIONS</h2>
      <div id="sessions-list"></div>
      <div id="sessions-empty" class="empty">NO SESSIONS<br>&#9608; zZz</div>
    </section>
  </div>

  <div id="right-col">
    <section id="usage-panel" class="panel">
      <h2>USAGE <span id="usage-stale" hidden>&#9888; STALE</span></h2>
      <div id="block-row">
        <div class="usage-label">BLOCK 5H <span id="block-reset"></span></div>
        <div id="block-bar"></div>
        <div id="block-info" class="usage-sub"></div>
      </div>
      <div id="usage-bars"></div>
    </section>

    <section id="events-panel" class="panel">
      <h2>EVENTS</h2>
      <div id="events-list"></div>
    </section>
  </div>
</main>

<div id="approval-overlay" hidden>
  <div id="approval-card">
    <h2>&#9888; APPROVAL</h2>
    <div id="approval-project" class="usage-label"></div>
    <div id="approval-tool"></div>
    <pre id="approval-input"></pre>
    <div id="approval-countdown"><div id="approval-countdown-fill"></div></div>
    <div id="approval-buttons">
      <button id="btn-deny">DENY</button>
      <button id="btn-allow">APPROVE</button>
    </div>
  </div>
</div>

<script src="logo.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
